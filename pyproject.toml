[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdlc"
version = "0.1.0"
description = "Tiered fault detection, classification and localisation in DER-rich distribution grids"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Oliver Anderson", email = "oliveranderson97@outlook.com" }
]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "veragridengine>=6.8",
    "pandapower>=2.14.0",
    "simbench>=1.5",
    "numpy>=2.2",
    "scipy>=1.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.2",
    "shap>=0.45",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gnn = ["torch-geometric>=2.5"]
dev = ["pytest>=8", "ruff>=0.5", "jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
